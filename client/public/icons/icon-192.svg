<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4655" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="#07090E" />
  <circle cx="96" cy="96" r="80" fill="url(#radarGlow)" />

  <!-- Radar Rings -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#242A38" stroke-width="2" />
  <circle cx="96" cy="96" r="44" fill="none" stroke="#FF3B30" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <circle cx="96" cy="96" r="24" fill="none" stroke="#242A38" stroke-width="2" />

  <!-- Radar Crosshairs -->
  <line x1="96" y1="20" x2="96" y2="172" stroke="#242A38" stroke-width="1.5" />
  <line x1="20" y1="96" x2="172" y2="96" stroke="#242A38" stroke-width="1.5" />

  <!-- Central Runner / Pulse Glyph -->
  <polygon points="96,48 128,140 96,120 64,140" fill="url(#primaryGradient)" />
  <circle cx="96" cy="96" r="8" fill="#FFFFFF" />
</svg>
