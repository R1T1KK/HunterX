<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="radarGlow512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="primaryGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4655" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#07090E" />
  <circle cx="256" cy="256" r="214" fill="url(#radarGlow512)" />

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#242A38" stroke-width="4" />
  <circle cx="256" cy="256" r="124" fill="none" stroke="#FF3B30" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="68" fill="none" stroke="#242A38" stroke-width="4" />

  <!-- Radar Crosshairs -->
  <line x1="256" y1="48" x2="256" y2="464" stroke="#242A38" stroke-width="3" />
  <line x1="48" y1="256" x2="464" y2="256" stroke="#242A38" stroke-width="3" />

  <!-- Central Runner / Pulse Glyph -->
  <polygon points="256,128 342,374 256,320 170,374" fill="url(#primaryGradient512)" />
  <circle cx="256" cy="256" r="20" fill="#FFFFFF" />
</svg>
